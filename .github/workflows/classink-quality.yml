name: ClassInk reliability checks

on:
  push:
    branches:
      - main
      - fix/classink-reliability-photo-imports
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  classink-quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/classink-ci.db
      AUTH_SECRET: classink-ci-test-secret-not-for-production
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Check Python syntax
        run: python -m compileall -q main.py classnet_common.py tests

      - name: Check database snapshot and frontend behavior
        run: pytest -q tests
