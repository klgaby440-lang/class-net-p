name: ClassInk reliability checks

on:
  push:
    branches:
      - main
      - fix/classink-reliability-photo-imports
      - feature/crypt-command-center-primeink-stateless-20261110
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  classink-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classnet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d classnet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classnet
      AUTH_SECRET: classink-ci-test-secret-not-for-production
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Check Python syntax
        run: python -m compileall -q main.py classnet_common.py tests

      - name: Check database snapshot and frontend behavior
        run: python -m pytest -q tests
